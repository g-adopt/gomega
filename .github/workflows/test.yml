name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: 1

jobs:
  test:
    name: Run Tests
    # The suite runs in seconds, so a GitHub-hosted runner is enough. This
    # matches the smoke test in g-adopt/g-adopt. A hosted runner also keeps
    # pull requests from forks off the self-hosted machines of the
    # organisation, which matters because this repository is public.
    runs-on: ubuntu-latest
    container:
      image: firedrakeproject/firedrake-vanilla-default:latest

    steps:
      # The Python gmsh module comes from the pip wheel (a dependency in
      # pyproject.toml). The wheel links against X11 and OpenGL libraries that
      # the Firedrake image does not have. The Debian gmsh package pulls in all
      # of them.
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y gmsh

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # No lock file exists, so a cache key cannot be computed.
          enable-cache: false

      # The image installs Firedrake as a system package, with no virtual
      # environment to activate. A venv with --system-site-packages sees that
      # Firedrake and keeps the gomega install apart from the system Python.
      - name: Set up Python environment
        run: |
          uv venv --system-site-packages
          uv pip install ".[dev]"

      - name: Run tests
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -v --tb=short --junit-xml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff

      # The demos are collected by pytest (testpaths covers them), so they are
      # part of the suite and get the same lint treatment as the package.
      - name: Run ruff
        run: ruff check gomega/ tests/ demos/
